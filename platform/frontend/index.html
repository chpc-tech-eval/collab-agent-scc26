<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCC26 Student Project Platform — collab-agent-scc26</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 2rem; }
    .container { max-width: 820px; margin: 0 auto; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 1.5rem; margin-bottom: 1.25rem; }
    h1, h2 { margin-top: 0; color: #38bdf8; }
    input, button { padding: 0.6rem 0.9rem; border-radius: 6px; border: 1px solid #475569; font-size: 0.95rem; }
    input { background: #0f172a; color: #f8fafc; width: 100%; box-sizing: border-box; margin-bottom: 0.75rem; }
    button { background: #0284c7; color: #fff; border: none; cursor: pointer; font-weight: 600; }
    button.secondary { background: #475569; }
    .badge { display: inline-block; background: #065f46; color: #6ee7b7; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.8rem; }
    .note { border-top: 1px solid #334155; padding: 0.65rem 0; }
    .hidden { display: none; }
    .error { color: #f87171; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>CHPC SCC26 — Student Project Platform</h1>
    <p>Project: <strong>collab-agent-scc26</strong> | Bounded Kubernetes + PostgreSQL POC</p>

    <div id="login-card" class="card">
      <h2>Team Operator Sign In</h2>
      <input id="username" type="text" placeholder="Username (e.g. scc26-student)" />
      <input id="password" type="password" placeholder="Password" />
      <button onclick="signIn()">Sign In</button>
      <div id="login-error" class="error"></div>
    </div>

    <div id="app-view" class="hidden">
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h2>Team Profile &amp; Platform Status</h2>
          <button class="secondary" onclick="signOut()">Sign Out</button>
        </div>
        <p><span class="badge">Authenticated</span> <strong id="profile-user"></strong> — <span id="profile-team"></span></p>
        <ul id="status-list"></ul>
      </div>

      <div class="card">
        <h2>PostgreSQL Persistent Experiment Notes</h2>
        <input id="note-input" type="text" placeholder="Record a persistent experiment note..." />
        <button onclick="addNote()">Save to PostgreSQL</button>
        <div id="notes-list" style="margin-top:1rem;"></div>
      </div>
    </div>
  </div>

  <script>
    async function loadSession() {
      const meRes = await fetch('/api/me');
      if (!meRes.ok) {
        document.getElementById('login-card').classList.remove('hidden');
        document.getElementById('app-view').classList.add('hidden');
        return;
      }
      const me = await meRes.json();
      document.getElementById('login-card').classList.add('hidden');
      document.getElementById('app-view').classList.remove('hidden');
      document.getElementById('profile-user').textContent = `${me.display_name} (${me.username})`;
      document.getElementById('profile-team').textContent = `${me.team_name} / ${me.project_slug}`;

      const stRes = await fetch('/api/status');
      const st = await stRes.json();
      document.getElementById('status-list').innerHTML = `
        <li><strong>Cluster:</strong> ${st.environment}</li>
        <li><strong>PostgreSQL:</strong> ${st.database_engine}</li>
        <li><strong>Telemetry:</strong> ${st.observability}</li>
      `;
      document.getElementById('notes-list').innerHTML = st.notes.map(n =>
        `<div class="note"><strong>#${n.id}</strong> [${n.created_at}] <em>${n.author}</em>: ${n.content}</div>`
      ).join('') || '<p>No persisted notes yet.</p>';
    }

    async function signIn() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      if (!res.ok) {
        document.getElementById('login-error').textContent = 'Invalid username or password.';
        return;
      }
      document.getElementById('login-error').textContent = '';
      await loadSession();
    }

    async function signOut() {
      await fetch('/api/logout', { method: 'POST' });
      await loadSession();
    }

    async function addNote() {
      const content = document.getElementById('note-input').value;
      if (!content.trim()) return;
      await fetch('/api/notes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content })
      });
      document.getElementById('note-input').value = '';
      await loadSession();
    }

    loadSession();
  </script>
</body>
</html>
