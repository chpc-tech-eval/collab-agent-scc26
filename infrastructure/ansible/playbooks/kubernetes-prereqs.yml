- name: Prepare Kubernetes control plane and workers
  hosts: control_plane:workers
  become: true
  gather_facts: true

  vars:
    kubernetes_version: "1.36.4"
    containerd_version: "2.3.4"
    cri_tools_version: "1.36.0"

    containerd_config: /etc/containerd/config.toml
    crictl_config: /etc/crictl.yaml

  pre_tasks:
    - name: Verify supported operating system
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Rocky"
          - ansible_distribution_major_version == "9"
        fail_msg: "This playbook expects Rocky Linux 9."

  tasks:
    - name: Install host prerequisite packages
      ansible.builtin.dnf:
        name:
          - curl
          - wget
          - ca-certificates
          - conntrack
          - socat
          - iproute-tc
          - iptables
          - ebtables
          - ethtool
          - tar
        state: present

    - name: Configure Docker repository for containerd
      ansible.builtin.yum_repository:
        name: docker-ce-stable
        description: Docker CE Stable
        baseurl: "https://download.docker.com/linux/centos/$releasever/$basearch/stable"
        enabled: true
        gpgcheck: true
        gpgkey: https://download.docker.com/linux/centos/gpg

    - name: Install pinned containerd version
      ansible.builtin.dnf:
        name: "containerd.io-{{ containerd_version }}*"
        state: present

    - name: Configure Kubernetes package repository
      ansible.builtin.yum_repository:
        name: kubernetes
        description: Kubernetes v1.36
        baseurl: https://pkgs.k8s.io/core:/stable:/v1.36/rpm/
        enabled: true
        gpgcheck: true
        repo_gpgcheck: true
        gpgkey: https://pkgs.k8s.io/core:/stable:/v1.36/rpm/repodata/repomd.xml.key

    - name: Install pinned Kubernetes packages
      ansible.builtin.dnf:
        name:
          - "kubelet-{{ kubernetes_version }}*"
          - "kubeadm-{{ kubernetes_version }}*"
          - "kubectl-{{ kubernetes_version }}*"
          - "cri-tools-{{ cri_tools_version }}*"
        state: present

    - name: Check whether containerd configuration exists
      ansible.builtin.stat:
        path: "{{ containerd_config }}"
      register: containerd_config_stat

    - name: Generate default containerd configuration
      ansible.builtin.command:
        cmd: containerd config default
      register: containerd_default_config
      changed_when: false
      when: not containerd_config_stat.stat.exists

    - name: Write default containerd configuration
      ansible.builtin.copy:
        content: "{{ containerd_default_config.stdout }}\n"
        dest: "{{ containerd_config }}"
        owner: root
        group: root
        mode: "0644"
      when: not containerd_config_stat.stat.exists
      notify: Restart containerd

    - name: Enable systemd cgroups in containerd
      ansible.builtin.replace:
        path: "{{ containerd_config }}"
        regexp: '(?m)^(\s*SystemdCgroup\s*=\s*)false\s*$'
        replace: '\1true'
      notify: Restart containerd

    - name: Create modules-load configuration
      ansible.builtin.copy:
        dest: /etc/modules-load.d/kubernetes.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          overlay
          br_netfilter

    - name: Load required kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Configure Kubernetes networking sysctls
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes-cri.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.ipv4.ip_forward = 1
      notify: Reload sysctl

    - name: Configure crictl to use containerd
      ansible.builtin.copy:
        dest: "{{ crictl_config }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          runtime-endpoint: unix:///run/containerd/containerd.sock
          image-endpoint: unix:///run/containerd/containerd.sock
          timeout: 10
          debug: false

    - name: Enable and start containerd
      ansible.builtin.systemd:
        name: containerd
        enabled: true
        state: started

    - name: Enable kubelet
      ansible.builtin.systemd:
        name: kubelet
        enabled: true
        state: stopped

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
        enabled: true

    - name: Reload sysctl
      ansible.builtin.command:
        cmd: sysctl --system
      changed_when: true