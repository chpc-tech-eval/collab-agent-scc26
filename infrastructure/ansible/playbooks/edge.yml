- name: Configure edge WireGuard gateway
  hosts: edge_nodes
  become: true
  gather_facts: true

  vars:
    wg_address: "10.200.0.1/24"
    wg_port: 51820
    wg_client_address: "10.200.0.2/32"
    wg_peers:
    - name: workstation
      public_key: "OtFd9bUqedE2c/0F/kY/khWifVIkT491BsN89xgxtA8="
      allowed_ips: "10.200.0.2/32"
    - name: teammate
      public_key: "qQPIXKKm6If75AC3Ewa6PTt/eY6VXH2ZkuYk9yYYGFI="
      allowed_ips: "10.200.0.3/32"
    - name: pride-workstation
      public_key: "9xdI/ZBKtacUrxRH46Yc5+U7jXzbXf2VjutcN/qZAik="
      allowed_ips: "10.200.0.4/32"
    wg_private_subnet: "172.26.1.0/24"
    dns_private_address: "172.26.0.10"
    dns_vpn_address: "10.200.0.1"
    dns_upstream_servers:
      - "1.1.1.1"
      - "8.8.8.8"
    dns_platform_addresses:
      - "172.26.1.21"
      - "172.26.1.22"

  tasks:
    - name: Install EPEL repository
      ansible.builtin.dnf:
        name: epel-release
        state: present

    - name: Install WireGuard and firewall tools
      ansible.builtin.dnf:
        name:
          - wireguard-tools
          - nftables
          - dnsmasq
        state: present

    - name: Ensure dnsmasq configuration directory exists
      ansible.builtin.file:
        path: /etc/dnsmasq.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Enable dnsmasq configuration directory
      ansible.builtin.lineinfile:
        path: /etc/dnsmasq.conf
        regexp: '^#?conf-dir='
        line: 'conf-dir=/etc/dnsmasq.d,.rpmnew,.rpmsave,.rpmorig'
        create: true

    - name: Disable conflicting dnsmasq bind-interfaces default
      ansible.builtin.lineinfile:
        path: /etc/dnsmasq.conf
        regexp: '^bind-interfaces$'
        state: absent

    - name: Configure private platform DNS
      ansible.builtin.copy:
        dest: /etc/dnsmasq.d/scc26.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          port=53
          listen-address={{ dns_private_address }},{{ dns_vpn_address }}
          bind-dynamic
          no-dhcp-interface=eth0
          no-dhcp-interface=wg0
          except-interface=lo
          no-resolv
          {% for server in dns_upstream_servers %}
          server={{ server }}
          {% endfor %}
          domain-needed
          bogus-priv
          local=/scc26.internal/
          {% for address in dns_platform_addresses %}
          host-record=student-platform.scc26.internal,{{ address }}
          host-record=wazuh.scc26.internal,{{ address }}
          {% endfor %}
          cache-size=1000
      notify: Restart dnsmasq

    - name: Enable and start dnsmasq
      ansible.builtin.service:
        name: dnsmasq
        state: started
        enabled: true

    - name: Create WireGuard configuration directory
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Check whether the server private key exists
      ansible.builtin.stat:
        path: /etc/wireguard/server.key
      register: wg_server_key_stat

    - name: Generate server private key
      ansible.builtin.command: wg genkey
      register: wg_server_key_generated
      changed_when: true
      no_log: true
      when: not wg_server_key_stat.stat.exists

    - name: Store server private key on edge only
      ansible.builtin.copy:
        content: "{{ wg_server_key_generated.stdout }}\n"
        dest: /etc/wireguard/server.key
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: not wg_server_key_stat.stat.exists

    - name: Derive server public key
      ansible.builtin.shell: |
        wg pubkey < /etc/wireguard/server.key > /etc/wireguard/server.pub
      args:
        creates: /etc/wireguard/server.pub
      changed_when: true

    - name: Read server private key for configuration
      ansible.builtin.slurp:
        src: /etc/wireguard/server.key
      register: wg_server_key
      no_log: true

    - name: Enable IPv4 forwarding persistently
      ansible.builtin.copy:
        dest: /etc/sysctl.d/90-wireguard-forwarding.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          net.ipv4.ip_forward = 1
      register: wg_sysctl_file

    - name: Apply IPv4 forwarding setting
      ansible.builtin.command: sysctl -w net.ipv4.ip_forward=1
      changed_when: true

    - name: Configure WireGuard interface
      ansible.builtin.copy:
        dest: /etc/wireguard/wg0.conf
        owner: root
        group: root
        mode: "0600"
        content: |
          [Interface]
          Address = {{ wg_address }}
          ListenPort = {{ wg_port }}
          PrivateKey = {{ wg_server_key.content | b64decode | trim }}

          {% for peer in wg_peers %}
          [Peer]
          PublicKey = {{ peer.public_key }}
          AllowedIPs = {{ peer.allowed_ips }}

          {% endfor %}
      notify: Restart WireGuard
      no_log: true

    - name: Install controlled VPN forwarding rules
      ansible.builtin.copy:
        dest: /etc/sysconfig/nftables.conf
        owner: root
        group: root
        mode: "0600"
        content: |
          # Managed by Ansible: WireGuard VPN forwarding.
          table inet wg_filter {
            chain forward {
              type filter hook forward priority filter; policy accept;
              iifname "wg0" oifname "eth0" ip daddr {{ wg_private_subnet }} accept
              iifname "eth0" oifname "wg0" ip saddr {{ wg_private_subnet }} ct state established,related accept
            }
          }
      notify: Restart nftables

    - name: Enable and start nftables
      ansible.builtin.service:
        name: nftables
        state: started
        enabled: true

    - name: Enable and start WireGuard
      ansible.builtin.service:
        name: wg-quick@wg0
        state: started
        enabled: true

    - name: Read server public key
      ansible.builtin.command: cat /etc/wireguard/server.pub
      register: wg_server_public_key
      changed_when: false

    - name: Display server public key
      ansible.builtin.debug:
        msg: "WireGuard server public key: {{ wg_server_public_key.stdout }}"

    - name: Verify WireGuard interface
      ansible.builtin.command: wg show wg0
      changed_when: false
      register: wg_status

    - name: Show WireGuard status
      ansible.builtin.debug:
        var: wg_status.stdout

  handlers:
    - name: Restart WireGuard
      ansible.builtin.service:
        name: wg-quick@wg0
        state: restarted

    - name: Restart nftables
      ansible.builtin.service:
        name: nftables
        state: restarted

    - name: Restart dnsmasq
      ansible.builtin.service:
        name: dnsmasq
        state: restarted
- name: Configure Wazuh Manager and Suricata IDS on edge
  hosts: edge_nodes
  become: true
  gather_facts: true

  vars:
    wazuh_version: "4.9"
    suricata_interface: "eth0"
    suricata_home_net: "[172.26.0.0/16,10.200.0.0/24]"

  tasks:
    - name: Import Wazuh GPG key
      tags: [wazuh]
      ansible.builtin.rpm_key:
        key: https://packages.wazuh.com/key/GPG-KEY-WAZUH
        state: present

    - name: Configure Wazuh YUM repository
      tags: [wazuh]
      ansible.builtin.yum_repository:
        name: wazuh
        description: EL-$releasever - Wazuh
        baseurl: "https://packages.wazuh.com/4.x/yum/"
        gpgcheck: true
        gpgkey: https://packages.wazuh.com/key/GPG-KEY-WAZUH
        enabled: true
        protect: true

    - name: Install Wazuh Manager
      tags: [wazuh]
      ansible.builtin.dnf:
        name: wazuh-manager
        state: present

    - name: Enable and start Wazuh Manager
      tags: [wazuh]
      ansible.builtin.service:
        name: wazuh-manager
        state: started
        enabled: true

    - name: Install EPEL and Suricata IDS
      tags: [suricata]
      ansible.builtin.dnf:
        name:
          - epel-release
          - suricata
        state: present

    - name: Ensure GENEVE_PORTS is defined in suricata.yaml
      ansible.builtin.lineinfile:
        path: /etc/suricata/suricata.yaml
        insertafter: "port-groups:"
        line: "    GENEVE_PORTS: \"6081\""
      notify: Restart suricata
      tags:
        - suricata

    - name: Ensure local Suricata rules directory exists
      tags: [suricata]
      ansible.builtin.file:
        path: /var/lib/suricata/rules
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install benign local IDS test rule
      tags: [suricata]
      ansible.builtin.copy:
        dest: /var/lib/suricata/rules/local.rules
        owner: root
        group: root
        mode: "0644"
        content: |
          # Benign test rule for authorised Week-3 IDS verification
          alert tcp any any -> any any (msg:"SCC26 Authorised IDS Test Request"; content:"X-SCC26-IDS-Test"; sid:9000001; rev:2;)
      notify: Restart suricata

    - name: Configure Suricata sysconfig interface
      tags: [suricata]
      ansible.builtin.copy:
        dest: /etc/sysconfig/suricata
        owner: root
        group: root
        mode: "0644"
        content: |
          OPTIONS="-i {{ suricata_interface }} -k none --user suricata"
      notify: Restart suricata

    - name: Remove legacy duplicate SCC26 IDS block from suricata.yaml
      tags: [suricata]
      ansible.builtin.blockinfile:
        path: /etc/suricata/suricata.yaml
        marker: "# {mark} ANSIBLE MANAGED SCC26 IDS"
        state: absent
      notify: Restart suricata

    - name: Register local.rules in primary Suricata rule-files list
      tags: [suricata]
      ansible.builtin.lineinfile:
        path: /etc/suricata/suricata.yaml
        insertafter: "^rule-files:"
        line: "  - /var/lib/suricata/rules/local.rules"
      notify: Restart suricata

    - name: Validate Suricata configuration
      tags: [suricata]
      ansible.builtin.command: suricata -T -c /etc/suricata/suricata.yaml
      changed_when: false

    - name: Enable and start Suricata IDS
      tags: [suricata]
      ansible.builtin.service:
        name: suricata
        state: started
        enabled: true

  handlers:
    - name: Restart suricata
      ansible.builtin.service:
        name: suricata
        state: restarted

- name: Configure Fluent Bit log shipper on edge
  hosts: edge_nodes
  become: true
  tags:
    - filebeat
    - fluentbit
  tasks:
    - name: Stop and disable legacy Filebeat if present
      ansible.builtin.service:
        name: filebeat
        state: stopped
        enabled: false
      ignore_errors: true

    - name: Configure Fluent Bit YUM repository
      ansible.builtin.yum_repository:
        name: fluent-bit
        description: Fluent Bit Official Repository
        baseurl: https://packages.fluentbit.io/rockylinux/$releasever/
        gpgcheck: true
        gpgkey: https://packages.fluentbit.io/fluentbit.key
        enabled: true

    - name: Install Fluent Bit
      ansible.builtin.dnf:
        name: fluent-bit
        state: present

    - name: Configure Fluent Bit to ship Wazuh and Suricata alerts to Wazuh Indexer
      ansible.builtin.copy:
        dest: /etc/fluent-bit/fluent-bit.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [SERVICE]
              Flush         2
              Log_Level     info
              Parsers_File  parsers.conf

          [INPUT]
              Name              tail
              Tag               wazuh.alerts
              Path              /var/ossec/logs/alerts/alerts.json
              Parser            json
              DB                /var/log/flb_wazuh.db
              Mem_Buf_Limit     10MB
              Read_from_Head    True

          [INPUT]
              Name              tail
              Tag               suricata.eve
              Path              /var/log/suricata/eve.json
              Parser            json
              DB                /var/log/flb_suricata.db
              Mem_Buf_Limit     10MB
              Read_from_Head    True

          [OUTPUT]
              Name                opensearch
              Match               *
              Host                172.26.1.21
              Port                30920
              Logstash_Format     On
              Logstash_Prefix     wazuh-alerts-4.x
              Logstash_DateFormat %Y.%m.%d
              Suppress_Type_Name  On
              tls                 Off
      notify: Restart fluent-bit

    - name: Enable and start Fluent Bit
      ansible.builtin.service:
        name: fluent-bit
        state: started
        enabled: true

  handlers:
    - name: Restart fluent-bit
      ansible.builtin.service:
        name: fluent-bit
        state: restarted
