- name: Configure edge WireGuard gateway
  hosts: edge_nodes
  become: true
  gather_facts: true

  vars:
    wg_address: "10.200.0.1/24"
    wg_port: 51820
    wg_client_address: "10.200.0.2/32"
    wg_peers:
    - name: workstation
      public_key: "OtFd9bUqedE2c/0F/kY/khWifVIkT491BsN89xgxtA8="
      allowed_ips: "10.200.0.2/32"
    - name: teammate
      public_key: "qQPIXKKm6If75AC3Ewa6PTt/eY6VXH2ZkuYk9yYYGFI="
      allowed_ips: "10.200.0.3/32"
    wg_private_subnet: "172.26.1.0/24"

  tasks:
    - name: Install EPEL repository
      ansible.builtin.dnf:
        name: epel-release
        state: present

    - name: Install WireGuard and firewall tools
      ansible.builtin.dnf:
        name:
          - wireguard-tools
          - nftables
        state: present

    - name: Create WireGuard configuration directory
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Check whether the server private key exists
      ansible.builtin.stat:
        path: /etc/wireguard/server.key
      register: wg_server_key_stat

    - name: Generate server private key
      ansible.builtin.command: wg genkey
      register: wg_server_key_generated
      changed_when: true
      no_log: true
      when: not wg_server_key_stat.stat.exists

    - name: Store server private key on edge only
      ansible.builtin.copy:
        content: "{{ wg_server_key_generated.stdout }}\n"
        dest: /etc/wireguard/server.key
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: not wg_server_key_stat.stat.exists

    - name: Derive server public key
      ansible.builtin.shell: |
        wg pubkey < /etc/wireguard/server.key > /etc/wireguard/server.pub
      args:
        creates: /etc/wireguard/server.pub
      changed_when: true

    - name: Read server private key for configuration
      ansible.builtin.slurp:
        src: /etc/wireguard/server.key
      register: wg_server_key
      no_log: true

    - name: Enable IPv4 forwarding persistently
      ansible.builtin.copy:
        dest: /etc/sysctl.d/90-wireguard-forwarding.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          net.ipv4.ip_forward = 1
      register: wg_sysctl_file

    - name: Apply IPv4 forwarding setting
      ansible.builtin.command: sysctl -w net.ipv4.ip_forward=1
      changed_when: true

    - name: Configure WireGuard interface
      ansible.builtin.copy:
        dest: /etc/wireguard/wg0.conf
        owner: root
        group: root
        mode: "0600"
        content: |
          [Interface]
          Address = {{ wg_address }}
          ListenPort = {{ wg_port }}
          PrivateKey = {{ wg_server_key.content | b64decode | trim }}

          {% for peer in wg_peers %}
          [Peer]
          PublicKey = {{ peer.public_key }}
          AllowedIPs = {{ peer.allowed_ips }}

          {% endfor %}
      notify: Restart WireGuard
      no_log: true

    - name: Install controlled VPN forwarding rules
      ansible.builtin.copy:
        dest: /etc/sysconfig/nftables.conf
        owner: root
        group: root
        mode: "0600"
        content: |
          # Managed by Ansible: WireGuard VPN forwarding.
          table inet wg_filter {
            chain forward {
              type filter hook forward priority filter; policy accept;
              iifname "wg0" oifname "eth0" ip daddr {{ wg_private_subnet }} accept
              iifname "eth0" oifname "wg0" ip saddr {{ wg_private_subnet }} ct state established,related accept
            }
          }
      notify: Restart nftables

    - name: Enable and start nftables
      ansible.builtin.service:
        name: nftables
        state: started
        enabled: true

    - name: Enable and start WireGuard
      ansible.builtin.service:
        name: wg-quick@wg0
        state: started
        enabled: true

    - name: Read server public key
      ansible.builtin.command: cat /etc/wireguard/server.pub
      register: wg_server_public_key
      changed_when: false

    - name: Display server public key
      ansible.builtin.debug:
        msg: "WireGuard server public key: {{ wg_server_public_key.stdout }}"

    - name: Verify WireGuard interface
      ansible.builtin.command: wg show wg0
      changed_when: false
      register: wg_status

    - name: Show WireGuard status
      ansible.builtin.debug:
        var: wg_status.stdout

  handlers:
    - name: Restart WireGuard
      ansible.builtin.service:
        name: wg-quick@wg0
        state: restarted

    - name: Restart nftables
      ansible.builtin.service:
        name: nftables
        state: restarted