name: Build and Publish Student Platform Image

on:
  push:
    branches: [dev]
    paths:
      - "platform/**"
      - ".github/workflows/platform-image.yml"
  pull_request:
    branches: [dev]
    paths:
      - "platform/**"
      - ".github/workflows/platform-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OCI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: platform/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/chpc-tech-eval/student-platform:sha-${{ github.sha }}
            ghcr.io/chpc-tech-eval/student-platform:latest
