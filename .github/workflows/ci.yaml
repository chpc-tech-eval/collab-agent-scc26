name: CI

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint YAML in gitops/
        run: |
          pip install yamllint
          yamllint -c .yamllint.yaml gitops/
