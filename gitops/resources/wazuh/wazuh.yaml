apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-indexer
  namespace: wazuh
spec:
  serviceName: wazuh-indexer
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-indexer
  template:
    metadata:
      labels:
        app: wazuh-indexer
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: sysctl-vm-max-map-count
          image: busybox:1.36
          securityContext:
            privileged: true
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144 && chown -R 1000:1000 /var/lib/wazuh-indexer"]
          volumeMounts:
            - name: indexer-data
              mountPath: /var/lib/wazuh-indexer
      containers:
        - name: wazuh-indexer
          image: wazuh/wazuh-indexer:4.14.1
          ports:
            - name: https
              containerPort: 9200
            - name: transport
              containerPort: 9300
          env:
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms1g -Xmx1g"
            - name: discovery.type
              value: "single-node"
            - name: plugins.security.disabled
              value: "true"
            - name: bootstrap.memory_lock
              value: "false"
            - name: cluster.name
              value: "wazuh-cluster"
            - name: node.name
              value: "wazuh-indexer-0"
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: indexer-data
              mountPath: /var/lib/wazuh-indexer
  volumeClaimTemplates:
    - metadata:
        name: indexer-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: cinder-ssd
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-indexer
  namespace: wazuh
spec:
  selector:
    app: wazuh-indexer
  ports:
    - name: http
      port: 9200
      targetPort: 9200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-dashboard
  namespace: wazuh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-dashboard
  template:
    metadata:
      labels:
        app: wazuh-dashboard
    spec:
      containers:
        - name: wazuh-dashboard
          image: wazuh/wazuh-dashboard:4.14.1
          ports:
            - name: http
              containerPort: 5601
          env:
            - name: OPENSEARCH_HOSTS
              value: "http://wazuh-indexer.wazuh.svc.cluster.local:9200"
            - name: SERVER_SSL_ENABLED
              value: "false"
            - name: OPENSEARCH_SSL_VERIFICATIONMODE
              value: "none"
            - name: WAZUH_API_URL
              value: "https://172.26.0.10"
            - name: API_USERNAME
              valueFrom:
                secretKeyRef:
                  name: wazuh-indexer-auth
                  key: username
            - name: API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wazuh-indexer-auth
                  key: password
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /app/login
              port: 5601
            initialDelaySeconds: 25
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-dashboard
  namespace: wazuh
spec:
  selector:
    app: wazuh-dashboard
  ports:
    - name: http
      port: 5601
      targetPort: 5601
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wazuh-dashboard-tls
  namespace: wazuh
spec:
  secretName: wazuh-dashboard-tls
  dnsNames:
    - wazuh.scc26.internal
  issuerRef:
    name: scc26-internal-ca
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wazuh-dashboard
  namespace: wazuh
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - wazuh.scc26.internal
      secretName: wazuh-dashboard-tls
  rules:
    - host: wazuh.scc26.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wazuh-dashboard
                port:
                  number: 5601
