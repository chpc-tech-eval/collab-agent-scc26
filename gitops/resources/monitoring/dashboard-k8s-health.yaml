apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-k8s-health
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  k8s-health.json: |
    {
      "uid": "scc26-k8s-health",
      "title": "Kubernetes Cluster Health",
      "tags": ["scc26", "kubernetes"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Pods by Phase",
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "targets": [
            {
              "expr": "sum by (phase) (kube_pod_status_phase == 1)",
              "legendFormat": "{{phase}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Ready Nodes",
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "targets": [
            {
              "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})",
              "legendFormat": "Ready Nodes"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Container Restarts (15m increase)",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 6},
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "targets": [
            {
              "expr": "sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total[15m])) > 0",
              "legendFormat": "{{namespace}}/{{pod}}"
            }
          ]
        }
      ]
    }
